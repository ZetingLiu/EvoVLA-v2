defaults:
  - env/calvin_abc@env.train
  - env/calvin_d@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "calvin_abc_d_ssrl_openpi_pi05"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 100

  resume_dir: null # Optional: path to a saved checkpoint directory, such as 'checkpoints/global_step_10'. If not None, it will be used to resume training.
  ckpt_path: null  # Optional: path to a .pt checkpoint. If not None, it will be loaded after the model is instantiated (for evaluation).

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  # ===== SSRL intrinsic rewards (self-supervised RL, plan calvin_ssrl) =====
  # enable=false ≡ original RLinf behavior (all hooks are no-ops).
  ssrl:
    enable: false
    rho: 0.6                  # backward-compatible fallback for old configs
    # Conservative starting weights; calibrate with a short reward smoke and
    # ablate before a full run. Each branch has its own schedule below.
    rho_con: 0.1
    rho_cur: 0.05
    use_contrastive: true
    use_curiosity: true
    freeze_backbone: true       # #10=B: freeze R3M, train projection head only
    freeze_encoder: false       # true = freeze the projection head too (real-robot
                                # default): only the ICM keeps training, so r_con
                                # measures progress in a fixed metric space
    normalize_intrinsic: true
    normalize_r_con: scale_only # preserve the sign of the potential difference
    normalize_r_cur: scale_only # r_cur is forward-MSE (nonnegative): mean_std would
                                # turn average-novelty steps into a per-step penalty
    clip_intrinsic: 1.0
    # Peak-memory knob: frames per R3M forward when encoding the [T*B] stack.
    encode_micro_batch: 256
    # Smooth the potential before differencing. The EMA resets at instruction,
    # episode and padding boundaries, so it never leaks across trajectories.
    s_ema_beta: 0.9
    # Applied after normalization; suppresses jitter without clipping true
    # negative progress to zero.
    r_con_deadband: 0.05
    reward_schedule:
      r_con:
        warmup_iters: 20
        decay_start_iters: -1   # both negative disables decay
        decay_end_iters: -1
        final_scale: 1.0
      r_cur:
        warmup_iters: 20
        decay_start_iters: 100
        decay_end_iters: 600
        final_scale: 0.1
    num_action_chunks: ${actor.model.num_action_chunks}
    encoder:
      backbone: r3m_resnet18
      latent_dim: 2048           # REAL R3M resnet18 output dim (512ch x 2x2 spatial), not 512
      proj_dim: 512              # CLIP text dim; projection head maps 2048 -> 512
      info_nce_temperature: 0.1
      positive_window: 3
      lang_align_coef: 0.5      # language alignment auxiliary (warmup + online)
      lr: 1.0e-4
    pretext:
      updates_per_iteration: 4  # pretext mini-batch steps per PPO iteration
      update_every_n_iters: 1   # >1 reduces non-stationarity (§8.3 #4)
      mini_batch_size: 256
    language:
      model: openai/clip-vit-base-patch32
      cache_per_instruction: true
    icm:
      space: pose               # pose (default, §3.3 B): forward model on scene_obs+proprio;
                                # visual: legacy wrist-latent fallback
      state_dim: 31             # CALVIN scene_obs(24) + ee_pos(3) + ee_rot(3) + gripper(1)
      action_mlp_dim: 128
      hidden_dim: 512
      forward_loss_coef: 1.0
      inverse_loss_coef: 0.0    # NOT IMPLEMENTED: the ICM has no inverse head
      lr: 1.0e-4                # NOT IMPLEMENTED: one pretext optimizer covers
                                # encoder + ICM and uses encoder.lr
    # NOT IMPLEMENTED: the camera keys are fixed to the openpi forward_inputs
    # ("observation/image" for contrastive, "observation/wrist_image" for the
    # visual-ICM fallback).
    cameras:
      contrastive: static
      curiosity: gripper        # only used when icm.space == visual
    # NOT WIRED: offline warmup has no training script yet (plan B = skip it);
    # SSRLModule.load_warmup_checkpoint() exists but nothing calls it.
    warmup:
      enable: false             # #10=B: no offline warmup by default (plan B)
      data_path: null
      steps: 50000
      batch_size: 64
      ckpt_path: checkpoints/ssrl_warmup_r3m18.pt
    logging:
      log_reward_components: true  # NOT IMPLEMENTED: ssrl/* metrics are always
                                   # logged when algorithm.ssrl.enable is true

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 8
    total_num_envs: 64
    max_episode_steps: 480 # for truncation
    max_steps_per_rollout_epoch: 480
    group_size: ${algorithm.group_size}
    reward_coef: ${algorithm.reward_coef}
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    rollout_epoch: 1
    total_num_envs: 50
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 9600
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "/path/to/model/RLinf-Pi05-CALVIN-ABC-D-SFT" # https://huggingface.co/RLinf/RLinf-Pi05-CALVIN-ABC-D-SFT
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 128
  global_batch_size: 2048 # maximum : global batch size = micro batch size * actor num_processes.
  seed: 42
  enable_offload: False

  model:
    model_path: "/path/to/model/RLinf-Pi05-CALVIN-ABC-D-SFT" # https://huggingface.co/RLinf/RLinf-Pi05-CALVIN-ABC-D-SFT
    model_type: "openpi"
    num_action_chunks: 5
    add_value_head: True
    # openpi specific parameters
    openpi:
      config_name: "pi05_calvin"
      num_images_in_input: 2
      noise_level: 0.5
      joint_logprob: False
      value_after_vlm: True
      value_vlm_mode: "mean_token"
      # SSRL language anchor (rollout side): mirrors algorithm.ssrl.
      # enable=false => lang_emb key is not written (zero behavior change).
      ssrl:
        enable: ${algorithm.ssrl.enable}
        language:
          model: ${algorithm.ssrl.language.model}

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported, please do not change this value

reward:
  use_reward_model: False

critic:
  use_critic_model: False
